[package]
authors = ["SamTV12345", "LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "ueberdb"
version = "0.1.0"
description = "ueberDB Rust port — multi-backend key-value abstraction with cache, write buffer, and napi binding"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
napi = { version = "3.0.0", features = ["tokio_rt", "serde-json"] }
napi-derive = "3.0.0"
redb = "2.1.2"
regex = "1.10.6"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
async-trait = "0.1"
dashmap = "6.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
moka = { version = "0.12", features = ["future"] }
tokio-util = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "json", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
bb8 = "0.8"
bb8-postgres = "0.8"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
