[package]
authors = ["SamTV12345", "LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "ueberdb"
version = "0.1.0"
description = "ueberDB Rust port — multi-backend key-value abstraction with cache, write buffer, and napi binding"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
napi = {version = "3.0.0", features = ["tokio_rt"]}
napi-derive = "3.0.0"
redb = "2.1.2"
regex = "1.10.6"
rusqlite = "0.37.0"
libsqlite3-sys = {version = "0.35.0", features = ["bundled"]}
hashbrown = "0.15.4"
rev_lines = "0.3.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
couch_rs = { version = "0.12.0", default-features = false, features = ["native-tls-vendored", "derive" ] }
postgres={version = "0.19.10"}

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
